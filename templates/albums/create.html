<!DOCTYPE html>
<html>
    <head>
        <title>Create</title>
    </head>
    <body>
        <form action="/albums/create/" method="POST">
            {% csrf_token %}
            {% for field in form %}
                    <div style="color:red">
                        {{ field.errors }}
                    </div>
            {% endfor %}
            {% for field in form %}
                <div class="fieldWrapper">
                    {{ field.label_tag }} {{ field }}
                    {% if field.help_text %}
                    <p class="help">{{ field.help_text|safe }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
